<!doctype html>
<html lang="en">
  <head>
    <title>Sandbox</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="" />
    <style>
      body {
        margin: 0;
        background-color: #008080;
        overflow: hidden;
        font-family: Arial;
        font-style: italic;
        font-weight: bold;
      }

      .buttons img {
        height: 50px;
      }

      a {
        color: #0000ee;
      }

      a:hover {
        color: #ff0000;
      }

      p {
        margin: 0;
      }

      .header {
        text-align: left;
        border: 1px solid black;
        border-radius: 10px;
        padding-left: 10px;
        padding-right: 10px;
        padding-top: 5px;
        padding-bottom: 5px;
        margin-bottom: 0px;
        /* width: fit-content; */
        transition: background-color, 0.4s;
        background-color: cyan;
        background-image: linear-gradient(to right, white, #00f0ff);
      }

      .header:hover {
        background-color: cyan;
      }

      .locationText {
        font-size: 20px;
        font-family: Cascadia Mono;
        text-decoration: none;
        color: black;
        text-align: left;
        display: block;
      }

      .locationText:hover {
        color: rgb(135, 206, 250);
      }

      .aboutText {
        margin-left: 20px;
        margin-right: 20px;
        border: 1px solid black;
        height: 50px;
        padding-left: 5px;
        padding-right: 5px;
        padding-top: 5px;
        background-color: rgb(0, 240, 255, 0.5);
      }
    </style>
  </head>

  <body>
    <div
      style="
        display: flex;
        height: 100vh;
        width: 100vw;
        justify-content: center;
        align-items: center;
      "
    >
      <div id="explorer" style="display: flex; align-items: flex-start"></div>
    </div>
  </body>
</html>
